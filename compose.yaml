services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ai_fashion_agent
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fashion_postgres:/var/lib/postgresql/data
      - ./backend/sql/001_calendar.sql:/docker-entrypoint-initdb.d/001_calendar.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d ai_fashion_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fashion_postgres:
